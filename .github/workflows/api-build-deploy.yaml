name: Build and deploy API

on:
  push:
    branches:
      - master
    paths:
      - 'server/src/**'
      - 'server/package.json'
      - 'server/wrangler.ci.toml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: prod
    env:
      # Shared across Configure Wrangler + Deploy steps
      D1_PHOTO_ALBUMS_WORKER: ${{ secrets.D1_PHOTO_ALBUMS_WORKER }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Used by envsubst in Configure Wrangler. These resolve against the `prod`
      # environment declared above, so they carry production values.
      ALBUM_URL: ${{ secrets.ALBUM_URL }}
      VITE_IMAGEKIT_CDN_URL: ${{ secrets.VITE_IMAGEKIT_CDN_URL }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      REGION_NAME: ${{ secrets.REGION_NAME }}
      PROD_PHOTO_ALBUMS_DB_NAME: ${{ secrets.PROD_PHOTO_ALBUMS_DB_NAME }}
      PROD_PHOTO_ALBUMS_DB_ID: ${{ secrets.PROD_PHOTO_ALBUMS_DB_ID }}
      # Dummy values for Dev vars to satisfy wrangler.toml validation
      DEV_PHOTO_ALBUMS_DB_NAME: 'DEV_PHOTO_ALBUMS_DB_NAME'
      DEV_PHOTO_ALBUMS_DB_ID: 'DEV_PHOTO_ALBUMS_DB_ID'

    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2.1.3
      - run: bun install

      - name: Test
        run: |
          bun run --cwd server types:server
          bun run --cwd server test:server

      - name: Configure Wrangler
        run: |
          cd "$GITHUB_WORKSPACE/server"
          # An unset secret substitutes to an empty string, which would deploy a Worker
          # bound to a nameless bucket or an empty CORS origin. Fail before that happens.
          for required in R2_BUCKET_NAME ALBUM_URL VITE_IMAGEKIT_CDN_URL \
                          PROD_PHOTO_ALBUMS_DB_NAME PROD_PHOTO_ALBUMS_DB_ID; do
            if [ -z "${!required}" ]; then
              echo "::error::$required is not set on the 'prod' environment." >&2
              exit 1
            fi
          done
          envsubst < wrangler.ci.toml > wrangler.tmp.toml
          mv wrangler.tmp.toml wrangler.toml

      - name: Upload Secrets
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          MAPBOXAPI_KEY: ${{ secrets.MAPBOXAPI_KEY }}
          SEARCH_PROXIMITY: ${{ vars.SEARCH_PROXIMITY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          cd "$GITHUB_WORKSPACE/server"
          # An empty value here deploys a Worker that cannot sign sessions, reach R2, or
          # search places, which fails at request time rather than at deploy time. MAPBOXAPI_KEY
          # is included because it is a rename, not a pre-existing secret: on the environment
          # where it is first introduced, nothing guarantees the new name was created before
          # this deploy runs, and an unset value here silently uploads an empty string that
          # 500s on every place search with no deploy-time signal.
          for required in JWT_SECRET R2_ACCESS_KEY R2_SECRET_KEY MAPBOXAPI_KEY; do
            if [ -z "${!required}" ]; then
              echo "::error::$required is not set on the 'prod' environment. Refusing to deploy." >&2
              exit 1
            fi
          done
          # printf '%s' rather than echo: echo appends a trailing newline that would be
          # stored as part of the secret value. Quoting prevents word splitting on
          # values containing whitespace or shell metacharacters.
          put_secret() {
            printf '%s' "$2" | bunx wrangler versions secret put "$1" --name "$D1_PHOTO_ALBUMS_WORKER" --env=""
          }
          put_secret R2_ACCESS_KEY "$R2_ACCESS_KEY"
          put_secret R2_SECRET_KEY "$R2_SECRET_KEY"
          put_secret VITE_GOOGLE_CLIENT_ID "$VITE_GOOGLE_CLIENT_ID"
          put_secret MAPBOXAPI_KEY "$MAPBOXAPI_KEY"
          # SEARCH_PROXIMITY is optional configuration, not a credential, so an unset
          # value must never be able to fail the deploy. Skip the upload entirely rather
          # than storing an empty secret. Note this means clearing the repo variable does
          # not clear an already-uploaded value - remove that with
          # `wrangler secret delete SEARCH_PROXIMITY` if you ever need to unset it.
          if [ -n "$SEARCH_PROXIMITY" ]; then
            put_secret SEARCH_PROXIMITY "$SEARCH_PROXIMITY"
          fi
          put_secret JWT_SECRET "$JWT_SECRET"
          put_secret RAPIDAPI_KEY "$RAPIDAPI_KEY"

      - name: Deploy Cloudflare Worker
        run: |
          cd "$GITHUB_WORKSPACE/server"
          bunx wrangler deploy --name "$D1_PHOTO_ALBUMS_WORKER" --env production
